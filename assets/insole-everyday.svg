<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 660" role="img" aria-label="Insole untuk aktiviti harian">
  <defs>
    <linearGradient id="e-body" x1="0.18" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#E6F5F7"/>
      <stop offset="0.46" stop-color="#00B3B8"/>
      <stop offset="1" stop-color="#00777C"/>
    </linearGradient>
    <radialGradient id="e-sheen" cx="0.36" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="e-rim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.44"/>
    </linearGradient>
    <filter id="e-shadow" x="-45%" y="-18%" width="190%" height="145%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0B3D91" flood-opacity="0.18"/>
    </filter>
    <path id="e-shape"
      d="M160,36
         C200,36 236,64 240,100
         C244,136 244,156 242,178
         C238,220 230,248 224,278
         C220,308 218,346 218,386
         C218,430 214,470 208,506
         C202,546 198,582 190,606
         C182,624 170,632 160,632
         C150,632 138,624 130,606
         C122,582 118,546 112,506
         C106,470 102,430 102,386
         C102,348 112,326 124,304
         C134,286 122,246 104,214
         C88,186 84,158 86,138
         C88,102 98,66 118,48
         C134,38 148,36 160,36 Z"/>
    <clipPath id="e-clip"><use href="#e-shape"/></clipPath>
  </defs>

  <ellipse cx="160" cy="644" rx="78" ry="11" fill="#0B3D91" opacity="0.06"/>

  <g filter="url(#e-shadow)">
    <use href="#e-shape" fill="url(#e-body)"/>
  </g>

  <g clip-path="url(#e-clip)">
    <use href="#e-shape" fill="url(#e-body)"/>
    <ellipse cx="150" cy="200" rx="140" ry="210" fill="url(#e-sheen)"/>

    <!-- perforations: everyday breathable foam -->
    <g fill="#0B3D91" opacity="0.2">
      <circle cx="146" cy="286" r="3"/><circle cx="176" cy="296" r="3"/>
      <circle cx="142" cy="326" r="3"/><circle cx="172" cy="338" r="3"/>
      <circle cx="146" cy="372" r="3"/><circle cx="176" cy="384" r="3"/>
      <circle cx="142" cy="420" r="3"/><circle cx="172" cy="432" r="3"/>
      <circle cx="148" cy="468" r="3"/><circle cx="176" cy="478" r="3"/>
    </g>

    <!-- soft arch line -->
    <path d="M112,452 C120,406 136,372 148,330 C155,304 150,274 145,248"
          fill="none" stroke="#0B3D91" stroke-opacity="0.22" stroke-width="8" stroke-linecap="round"/>

    <!-- heel cushion -->
    <path d="M124,540 C131,580 145,600 160,600 C175,600 189,580 196,540"
          fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="2.8" stroke-linecap="round"/>

    <!-- forefoot seam -->
    <path d="M126,190 C146,182 174,182 194,190" fill="none"
          stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.8" stroke-linecap="round"/>
  </g>

  <use href="#e-shape" fill="none" stroke="url(#e-rim)" stroke-width="2.2"/>
</svg>
