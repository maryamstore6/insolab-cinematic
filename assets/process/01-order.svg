<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 92" role="img" aria-label="Buat pesanan">
  <defs>
    <linearGradient id="p1-surface" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F5F7FA"/>
      <stop offset="1" stop-color="#E2E9F2"/>
    </linearGradient>
    <linearGradient id="p1-teal" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#00B3B8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00777C" stop-opacity="0.32"/>
    </linearGradient>
    <filter id="p1-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0B3D91" flood-opacity="0.13"/>
    </filter>
  </defs>
  <g filter="url(#p1-soft)">
    <rect x="34" y="8" width="50" height="76" rx="8" fill="url(#p1-surface)"/>
  </g>
  <rect x="34" y="8" width="50" height="76" rx="8" fill="none" stroke="#E2E9F2" stroke-width="1.4"/>
  <rect x="41" y="16" width="36" height="60" rx="4" fill="#F5F7FA" stroke="#E2E9F2" stroke-width="1"/>

  <!-- two bold rows + a price bar: enough to still read as a form at 56px -->
  <rect x="47" y="24" width="24" height="6" rx="3" fill="#00777C" opacity="0.8"/>
  <rect x="47" y="36" width="24" height="5" rx="2.5" fill="#5F6B7A" opacity="0.38"/>
  <rect x="47" y="47" width="24" height="5" rx="2.5" fill="#5F6B7A" opacity="0.38"/>
  <rect x="47" y="58" width="24" height="11" rx="5.5" fill="#00B3B8" opacity="0.92"/>

  <circle cx="80" cy="72" r="14" fill="#00777C"/>
  <path d="M73.5,72 L78,76.5 L86.5,67" fill="none" stroke="#FFFFFF"
        stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
