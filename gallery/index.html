<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InsoLab — Galeri Aset Marketing</title>
<style>
:root{--navy:#0B3D91;--teal:#00B3B8;--bg:#f5f7fa;--ink:#1a2230;--muted:#5a6472;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
header{background:var(--navy);color:#fff;padding:3rem 1.5rem;text-align:center}
header h1{font-size:clamp(1.8rem,4vw,2.8rem);margin-bottom:.5rem}
header p{opacity:.85;font-size:1.05rem}
.wrap{max-width:1200px;margin:0 auto;padding:2rem 1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.5rem}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px -12px rgba(11,61,145,.18)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.card figcaption{padding:1rem 1.2rem;font-weight:600;color:var(--ink);font-size:.95rem}
footer{text-align:center;padding:2rem;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<header>
  <h1>InsoLab — Galeri Aset Marketing</h1>
  <p>11 gambar aset untuk web & video UGC</p>
</header>
<div class="wrap">
  <div class="grid">
    <figure class="card">
      <img src="before-after-alignment.webp" alt="Before After Alignment" loading="lazy">
      <figcaption>Before After Alignment</figcaption>
    </figure>
    <figure class="card">
      <img src="composite-render-panels.webp" alt="Composite Render Panels" loading="lazy">
      <figcaption>Composite Render Panels</figcaption>
    </figure>
    <figure class="card">
      <img src="demo-foot-foam-insole.webp" alt="Demo Foot Foam Insole" loading="lazy">
      <figcaption>Demo Foot Foam Insole</figcaption>
    </figure>
    <figure class="card">
      <img src="demo-foot-foam.webp" alt="Demo Foot Foam" loading="lazy">
      <figcaption>Demo Foot Foam</figcaption>
    </figure>
    <figure class="card">
      <img src="hero-render-3d.webp" alt="Hero Render 3D" loading="lazy">
      <figcaption>Hero Render 3D</figcaption>
    </figure>
    <figure class="card">
      <img src="process-box-foam.webp" alt="Process Box Foam" loading="lazy">
      <figcaption>Process Box Foam</figcaption>
    </figure>
    <figure class="card">
      <img src="process-hands-foam.webp" alt="Process Hands Foam" loading="lazy">
      <figcaption>Process Hands Foam</figcaption>
    </figure>
    <figure class="card">
      <img src="process-workflow-6panel.webp" alt="Process Workflow 6Panel" loading="lazy">
      <figcaption>Process Workflow 6Panel</figcaption>
    </figure>
    <figure class="card">
      <img src="product-insole-box.webp" alt="Product Insole Box" loading="lazy">
      <figcaption>Product Insole Box</figcaption>
    </figure>
    <figure class="card">
      <img src="product-kit-foam.webp" alt="Product Kit Foam" loading="lazy">
      <figcaption>Product Kit Foam</figcaption>
    </figure>
    <figure class="card">
      <img src="product-pair-box.webp" alt="Product Pair Box" loading="lazy">
      <figcaption>Product Pair Box</figcaption>
    </figure>
  </div>
</div>
<footer>InsoLab Assets · 2026</footer>
</body>
</html>
